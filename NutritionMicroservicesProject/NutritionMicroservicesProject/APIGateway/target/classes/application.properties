spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.cloud.gateway.server.webflux.routes[0].id=nutrition-plan-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://NUTRITION-PLAN-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/nutritionplan/**
spring.cloud.gateway.server.webflux.routes[1].id=food-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://FOOD-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/foods/**
spring.cloud.gateway.server.webflux.routes[2].id=user-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/users/**
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true